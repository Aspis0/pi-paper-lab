name: publish

# Publishes pi-paper-lab to npm via Trusted Publishing (OIDC).
# Compatible with npm v12+ deprecation of 2FA-bypass tokens (Jan 2027).
# Setup: https://docs.npmjs.com/trusted-publishers
#   1. Go to https://www.npmjs.com/package/pi-paper-lab/access
#   2. "Publishing access" → "Add a trusted publisher"
#   3. Repository: Aspis0/pi-paper-lab
#   4. Workflow filename: publish.yml
#   5. Environment: (leave blank)

on:
  push:
    tags:
      - 'v*'        # e.g. v0.6.0 — triggers on every version tag
  workflow_dispatch:  # manual trigger from GitHub Actions tab

permissions:
  id-token: write    # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: node --experimental-strip-types --test tests/anti-ai-lexicon.test.ts

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # auto-provided by trusted publishing (OIDC)

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
